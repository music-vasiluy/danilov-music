name: Синхронизация песен из Telegram

on:
  # Автозапуск по расписанию отключён: проверка идёт на вашем ПК
  # каждый день в 15:00 (sync/run-local.ps1, задание «DanilovMusicSync»).
  # Кнопка «Run workflow» запускает проверку вручную (нужен секрет BOT_TOKEN).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Подготовка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Собрать песни из Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: Danilov_Vasilii_music
        run: node sync/sync.mjs

      - name: Сохранить изменения в репозиторий
        run: |
          git config user.name "telegram-sync-bot"
          git config user.email "telegram-sync-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — сайт уже актуален"
          else
            git commit -m "Синхронизация песен из Telegram"
            git push
          fi
